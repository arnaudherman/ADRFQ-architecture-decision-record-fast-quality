# Hooks pre-commit exposés par ce dépôt (https://pre-commit.com).
# Dans le dépôt consommateur, .pre-commit-config.yaml :
#
#   repos:
#     - repo: <url de ce dépôt>
#       rev: <tag ou sha>
#       hooks:
#         - id: lint-adr
#         - id: check-index-adr
#
- id: lint-adr
  name: Linter d'ADR (format canonique)
  description: Vérifie la conformité des ADR du dossier adr/ au template canonique.
  entry: python3 scripts/lint-adr.py adr
  language: system
  files: ^adr/.*\.md$
  pass_filenames: false

- id: check-index-adr
  name: Fraîcheur de l'index des ADR
  description: Échoue si adr/INDEX.md ne reflète plus le corpus (régénérer avec --index).
  entry: python3 scripts/lint-adr.py --check-index adr
  language: system
  files: ^adr/.*\.md$
  pass_filenames: false
